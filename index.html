<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa da Ocorrência</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    .legend {
      background: white;
      padding: 10px;
      font-size: 14px;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    function parseParams() {
      const url = new URL(window.location.href);
      return {
        mapa: url.searchParams.get("mapa") || "policiamento",
        cidade: url.searchParams.get("cidade") || "",
        uf: url.searchParams.get("uf") || "",
        endereco: url.searchParams.get("endereco") || "",
        ocorrencia: url.searchParams.get("ocorrencia") || ""
      };
    }

    async function geocodeEndereco(enderecoCompleto) {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(enderecoCompleto)}`;
      const resp = await fetch(url);
      const dados = await resp.json();
      return dados.length > 0 ? [parseFloat(dados[0].lat), parseFloat(dados[0].lon)] : null;
    }

    async function carregarPontosExtras(tipo, cidade, uf) {
      // Exemplo: carrega pontos pré-definidos de acordo com o modo
      const dados = {
        policiamento: [
          { tipo: "PM", nome: "15º BPM", endereco: `Rua da PM, ${cidade} - ${uf}` },
          { tipo: "PRF", nome: "Delegacia PRF", endereco: `BR-116, ${cidade} - ${uf}` }
        ],
        fuga: [
          { tipo: "FUGA", nome: "Ponto de Fuga 1", endereco: `Saída Norte, ${cidade} - ${uf}` },
          { tipo: "FUGA", nome: "Ponto de Fuga 2", endereco: `Saída Leste, ${cidade} - ${uf}` }
        ]
      };
      return dados[tipo] || [];
    }

    function escolherIcone(tipo) {
      const icons = {
        PM: "blue",
        PRF: "green",
        PRE: "orange",
        PC: "gray",
        Bombeiros: "red",
        FUGA: "black"
      };
      return new L.Icon({
        iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${icons[tipo] || "blue"}.png`,
        shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
      });
    }

    async function montarMapa() {
      const { mapa, cidade, uf, endereco, ocorrencia } = parseParams();
      const localizacaoTexto = `${endereco}, ${cidade} - ${uf}`;
      const coords = await geocodeEndereco(localizacaoTexto);

      const map = L.map('map').setView(coords || [-15.78, -47.93], coords ? 13 : 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      if (coords) {
        L.marker(coords).addTo(map).bindPopup(`<b>Local da ocorrência</b><br>${localizacaoTexto}<br>${ocorrencia}`);
      }

      const pontosExtras = await carregarPontosExtras(mapa, cidade, uf);

      pontosExtras.forEach(async ponto => {
        const coord = await geocodeEndereco(ponto.endereco);
        if (coord) {
          const icone = escolherIcone(ponto.tipo);
          L.marker(coord, { icon: icone })
            .addTo(map)
            .bindPopup(`<b>${ponto.nome}</b><br>${ponto.endereco}`);
        }
      });
    }

    montarMapa();
  </script>
</body>
</html>
