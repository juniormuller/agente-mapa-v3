<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa da Ocorrência</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    #map {
      height: 100%;
      width: 100%;
    }
    .legend {
      background: white;
      padding: 10px;
      font-size: 14px;
      border-radius: 5px;
      box-shadow: 0 0 5px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    function parseParams() {
      const url = new URL(window.location.href);
      return {
        cidade: url.searchParams.get("cidade") || "",
        uf: url.searchParams.get("uf") || "",
        endereco: url.searchParams.get("endereco") || "",
        ocorrencia: url.searchParams.get("ocorrencia") || ""
      };
    }

    async function geocodeEndereco(enderecoCompleto) {
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(enderecoCompleto)}`;
      const resp = await fetch(url);
      const dados = await resp.json();
      return dados.length > 0 ? [parseFloat(dados[0].lat), parseFloat(dados[0].lon)] : null;
    }

    function criarIcone(cor) {
      return new L.Icon({
        iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-${cor}.png`,
        shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
        iconSize: [25, 41],
        iconAnchor: [12, 41],
        popupAnchor: [1, -34],
        shadowSize: [41, 41]
      });
    }

    async function montarMapa() {
      const { cidade, uf, endereco, ocorrencia } = parseParams();
      const localizacaoTexto = `${endereco}, ${cidade} - ${uf}`;
      const coords = await geocodeEndereco(localizacaoTexto);

      const map = L.map('map').setView(coords || [-15.78, -47.93], coords ? 13 : 5);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      // Local da ocorrência
      if (coords) {
        L.marker(coords, { icon: criarIcone("yellow") })
          .addTo(map)
          .bindPopup(`<b>Local da ocorrência</b><br>${localizacaoTexto}<br>${ocorrencia}`);
      }

      // Pontos de policiamento
      const pontosPoliciamento = [
        { nome: "15º BPM", endereco: `Rua João Abott, ${cidade} - ${uf}` },
        { nome: "PRF Lajeado", endereco: `BR-386, km 340, ${cidade} - ${uf}` }
      ];

      for (const p of pontosPoliciamento) {
        const coord = await geocodeEndereco(p.endereco);
        if (coord) {
          L.marker(coord, { icon: criarIcone("blue") })
            .addTo(map)
            .bindPopup(`<b>${p.nome}</b><br>${p.endereco}`);
        }
      }

      // Pontos de rota de fuga
      const pontosFuga = [
        { nome: "Saída para Arroio do Meio", endereco: `RSC-453, acesso oeste, ${cidade} - ${uf}` },
        { nome: "Saída para BR-386 sentido capital", endereco: `BR-386, km 347, ${cidade} - ${uf}` }
      ];

      for (const p of pontosFuga) {
        const coord = await geocodeEndereco(p.endereco);
        if (coord) {
          L.marker(coord, { icon: criarIcone("red") })
            .addTo(map)
            .bindPopup(`<b>${p.nome}</b><br>${p.endereco}`);
        }
      }

    }

    montarMapa();
  </script>
</body>
</html>
